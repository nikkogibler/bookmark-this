name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check release privacy
        run: python scripts/check_release_privacy.py
      - name: Check skill frontmatter
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path("skills/bookmark-this/SKILL.md")
          text = path.read_text(encoding="utf-8")
          match = re.match(r"^---\n(.*?)\n---", text, re.DOTALL)
          assert match, "Missing frontmatter"
          frontmatter = match.group(1)
          assert re.search(r"^name: bookmark-this$", frontmatter, re.MULTILINE)
          assert re.search(r"^description: .+", frontmatter, re.MULTILINE)
          assert "TODO" not in text
          print("Skill frontmatter looks valid")
          PY
